<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - MedicSense AI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style_ultra.css" />
    <style>
      body {
        padding-top: 0 !important;
      }
      .notifications-container {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2rem;
      }
      .notifications-header {
        background: white;
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .notifications-header h1 {
        margin: 0;
        color: #1e293b;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .notifications-header-actions {
        display: flex;
        gap: 1rem;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }
      .btn-secondary {
        background: #e2e8f0;
        color: #1e293b;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn-secondary:hover {
        background: #cbd5e1;
      }
      .notifications-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: white;
        border-radius: 15px;
        padding: 1.5rem;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .stat-card h3 {
        color: #64748b;
        font-size: 0.875rem;
        margin: 0 0 0.5rem 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stat-card .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #667eea;
        margin: 0;
      }
      .notifications-section {
        background: white;
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .notifications-section h2 {
        color: #1e293b;
        margin: 0 0 1.5rem 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .notifications-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .notification-item {
        border: 2px solid #e2e8f0;
        border-radius: 15px;
        padding: 1.5rem;
        transition: all 0.3s;
        position: relative;
        cursor: pointer;
        background: #fff;
      }
      .notification-item:hover {
        border-color: #667eea;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }
      .notification-item.unread {
        background: #f0f9ff;
        border-color: #667eea;
        border-left: 4px solid #667eea;
      }
      .notification-item.read {
        background: #f8fafc;
        opacity: 0.8;
      }
      .notification-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.75rem;
      }
      .notification-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex: 1;
      }
      .notification-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        flex-shrink: 0;
      }
      .notification-icon.appointment {
        background: #dbeafe;
        color: #3b82f6;
      }
      .notification-icon.medication {
        background: #fef3c7;
        color: #f59e0b;
      }
      .notification-icon.health_tip {
        background: #d1fae5;
        color: #10b981;
      }
      .notification-icon.emergency {
        background: #fee2e2;
        color: #ef4444;
      }
      .notification-icon.system {
        background: #e0e7ff;
        color: #6366f1;
      }
      .notification-content h3 {
        margin: 0 0 0.25rem 0;
        color: #1e293b;
        font-size: 1.1rem;
      }
      .notification-content p {
        margin: 0;
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .notification-time {
        color: #94a3b8;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .notification-actions {
        display: flex;
        gap: 0.5rem;
      }
      .notification-action-btn {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 8px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .notification-action-btn:hover {
        background: #f1f5f9;
        color: #1e293b;
      }
      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: #64748b;
      }
      .empty-state i {
        font-size: 4rem;
        margin-bottom: 1rem;
        color: #cbd5e1;
      }
      .empty-state h3 {
        color: #1e293b;
        margin-bottom: 0.5rem;
      }
      .empty-state p {
        color: #64748b;
      }
      .back-btn {
        position: fixed;
        top: 2rem;
        left: 2rem;
        background: white;
        border: none;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #1e293b;
        font-weight: 500;
      }
      .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }
      .filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .filter-tab {
        padding: 0.5rem 1rem;
        border: 2px solid #e2e8f0;
        background: white;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
        color: #64748b;
      }
      .filter-tab:hover {
        border-color: #667eea;
        color: #667eea;
      }
      .filter-tab.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
      }
      @media (max-width: 768px) {
        .notifications-container {
          padding: 1rem;
        }
        .notifications-header {
          flex-direction: column;
          gap: 1rem;
          align-items: flex-start;
        }
        .notifications-header-actions {
          width: 100%;
          flex-direction: column;
        }
        .notifications-header-actions button {
          width: 100%;
        }
        .back-btn {
          top: 1rem;
          left: 1rem;
        }
      }
      .mark-all-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .empty-hint {
        margin-top: 0.5rem;
        color: #6b7280;
        font-size: 0.9rem;
      }

      /* JUDGE-READY UNREAD STYLING */
      .notification-item.unread .notification-content h3 {
        font-weight: 600;
        color: #1e293b;
      }
      .notification-item.unread::before {
        content: "";
        width: 8px;
        height: 8px;
        background: #6366f1;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="notifications-container">
      <a href="index.html" class="back-btn" style="text-decoration: none;">
        <i class="fas fa-arrow-left"></i> Back
      </a>

      <div class="notifications-header">
        <h1>
          <i class="fas fa-bell"></i>
          Notifications
        </h1>
        <div class="notifications-header-actions">
          <button id="markAllBtn" class="btn-secondary mark-all-btn" onclick="markAllAsRead()">
            <i class="fas fa-check-double"></i> Mark All Read
          </button>
          <button class="btn-primary" onclick="fetchNotifications()">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>
      </div>

      <div class="notifications-stats">
        <div class="stat-card">
          <h3>Total Notifications</h3>
          <p class="stat-value" id="totalCount">0</p>
        </div>
        <div class="stat-card">
          <h3>Unread</h3>
          <p class="stat-value" id="unreadCount">0</p>
        </div>
        <div class="stat-card">
          <h3>Appointments</h3>
          <p class="stat-value" id="appointmentCount">0</p>
        </div>
        <div class="stat-card">
          <h3>Medications</h3>
          <p class="stat-value" id="medicationCount">0</p>
        </div>
      </div>

      <div class="notifications-section">
        <h2><i class="fas fa-list"></i> Filtered View</h2>

        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="unread">Unread</button>
          <button class="filter-tab" data-filter="appointment">Appointments</button>
          <button class="filter-tab" data-filter="medication">Medications</button>
          <button class="filter-tab" data-filter="health_tip">Health Tips</button>
        </div>

        <div class="notifications-list" id="notificationsList">
          <!-- Rendered via JS -->
          <div class="empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading notifications...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Configuration -->
    <script src="env-loader.js"></script>
    <script src="load-env.js"></script>
    <script>
      // CONFIG Setup
      const CONFIG = {
        API_BASE_URL: (window.ENV && window.ENV.API_BASE_URL) || "http://localhost:5000/api"
      };

      // 1. GLOBALS (AS REQUESTED)
      let notifications = [];
      let activeFilter = "all";

      // 2. USER RESOLUTION
      function resolveUserId() {
        const persisted = localStorage.getItem("medicsense_user_id");
        if (persisted && persisted !== "null" && persisted !== "undefined") {
          return String(persisted);
        }
        // Fallback for demo
        return "guest_user";
      }

      // 3. CORE FUNCTIONS (LOCKED ARCHITECTURE)

      async function fetchNotifications() {
        try {
          const uid = resolveUserId();
          const res = await fetch(`${CONFIG.API_BASE_URL}/notifications?user_id=${encodeURIComponent(uid)}&limit=100`);
          const data = await res.json();

          if (data.success) {
            // Mapping backend "read" field to frontend "is_read" for architectural clarity
            notifications = (data.data || []).map(n => ({
              ...n,
              is_read: n.read === true // Ensure it's a boolean
            }));

            updateStats();
            renderNotifications();
            updateBellBadge();
          }
        } catch (err) {
          console.error("Fetch failed:", err);
        }
      }

      function renderNotifications() {
        const container = document.getElementById("notificationsList");
        if (!container) return;

        container.innerHTML = "";

        // Filtering logic
        let filtered = [...notifications];
        if (activeFilter === "unread") {
          filtered = filtered.filter(n => !n.is_read);
        } else if (activeFilter !== "all") {
          filtered = filtered.filter(n => n.type === activeFilter);
        }

        // Sorting (Newest first)
        filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-bell-slash"></i>
              <h3>All caught up</h3>
              <p class="empty-hint">${
                activeFilter === "all"
                ? "You’re all caught up! Book an appointment to receive reminders and updates."
                : `No ${activeFilter} notifications found.`
              }</p>
            </div>
          `;
          return;
        }

        filtered.forEach(n => {
          const timeAgo = getTimeAgo(n.timestamp);
          const icon = getIcon(n.type);
          const iconClass = n.type || 'system';

          container.innerHTML += `
            <div class="notification-item ${!n.is_read ? "unread" : "read"}"
                 onclick="markNotificationRead('${n.id}')">
              <div class="notification-header">
                <div class="notification-title">
                  <div class="notification-icon ${iconClass}">
                    <i class="${icon}"></i>
                  </div>
                  <div class="notification-content">
                    <h3>${n.title}</h3>
                    <p>${n.message}</p>
                  </div>
                </div>
              </div>
              <div class="notification-time">
                <i class="fas fa-clock"></i>
                <span>${timeAgo}</span>
              </div>
            </div>
          `;
        });
      }

      async function markNotificationRead(id) {
        const notification = notifications.find(n => n.id === id);
        if (!notification || notification.is_read) return;

        try {
          const uid = resolveUserId();
          await fetch(`${CONFIG.API_BASE_URL}/notifications/read`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: uid, notification_id: id })
          });

          // ✅ update the ONLY source of truth
          notifications = notifications.map(n =>
            n.id === id ? { ...n, is_read: true } : n
          );

          // 🔥 ORDER MATTERS (Derived every time)
          updateStats();        // recalc unread count
          updateBellBadge();   // recalc bell dot
          renderNotifications(); // re-filter + re-render
        } catch (err) {
          console.error("Mark read failed:", err);
        }
      }

      async function markAllAsRead() {
        const unreadCount = notifications.filter(n => !n.is_read).length;
        if (unreadCount === 0) return;

        try {
          const uid = resolveUserId();
          await fetch(`${CONFIG.API_BASE_URL}/notifications/read-all`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: uid })
          });

          // ✅ update the ONLY source of truth
          notifications = notifications.map(n => ({ ...n, is_read: true }));

          // 🔥 ORDER MATTERS
          updateStats();
          updateBellBadge();
          renderNotifications();
        } catch (err) {
          console.error("Mark all read failed:", err);
        }
      }

      function updateStats() {
        // ✅ derive from source every time
        document.getElementById("totalCount").textContent =
          notifications.length;

        const unreadCount = notifications.filter(n => !n.is_read).length;
        document.getElementById("unreadCount").textContent = unreadCount;

        document.getElementById("appointmentCount").textContent =
          notifications.filter(n => n.type === "appointment").length;

        document.getElementById("medicationCount").textContent =
          notifications.filter(n => n.type === "medication").length;

        const markAllBtn = document.getElementById("markAllBtn");
        if (markAllBtn) markAllBtn.disabled = (unreadCount === 0);
      }

      function updateBellBadge() {
        // This syncs with the parent window or common storage if needed,
        // but since we are on the notifications page, we just ensure stats are current.
        // We also trigger a custom event that script_ultra.js can listen to if it's in the same window.
        window.dispatchEvent(new CustomEvent('notifications-updated'));
        console.log("🔔 Bell badge update triggered");
      }

      // 4. TAB WIRING (MANDATORY)
      document.querySelectorAll(".filter-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          activeFilter = btn.dataset.filter;

          document.querySelectorAll(".filter-tab").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          renderNotifications();
        });
      });

      // 5. UTILITIES
      function getIcon(type) {
        const icons = {
          appointment: "fas fa-calendar-check",
          medication: "fas fa-pills",
          health_tip: "fas fa-lightbulb",
          emergency: "fas fa-exclamation-triangle",
          system: "fas fa-info-circle",
        };
        return icons[type] || "fas fa-info-circle";
      }

      function getTimeAgo(timestamp) {
        const now = new Date();
        const time = new Date(timestamp);
        const diffMs = now - time;
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 1) return "Just now";
        if (diffMins < 60) return `${diffMins}m ago`;
        const diffHours = Math.floor(diffMs / 3600000);
        if (diffHours < 24) return `${diffHours}h ago`;
        return time.toLocaleDateString();
      }

      // 6. INIT
      window.addEventListener('DOMContentLoaded', fetchNotifications);
    </script>
  </body>
</html>
