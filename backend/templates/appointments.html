<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const storageKey = "medicsense_dark_mode";
        const storedTheme = localStorage.getItem(storageKey);
        // Default to dark mode if no preference is saved
        const isDark = storedTheme === null ? true : storedTheme === "1";
        document.documentElement.setAttribute(
          "data-theme",
          isDark ? "dark" : "light"
        );
        if (isDark) {
          document.documentElement.classList.add("dark-mode");
        } else {
          document.documentElement.classList.remove("dark-mode");
        }
        // Save the default preference
        if (storedTheme === null) {
          localStorage.setItem(storageKey, "1");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Appointments - MedicSense AI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style_ultra.css" />
    <style>
      body {
        padding-top: 0 !important;
      }

      .apt-page-container {
        min-height: 100vh;
        padding: 2rem;
      }

      [data-theme="dark"] .apt-page-container {
        background: transparent;
      }

      .apt-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        font-weight: 500;
        margin-bottom: 1.5rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        transition: all 0.2s;
        font-size: 0.95rem;
      }

      .apt-back-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      .apt-content-section {
        background: var(--bg-card);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .apt-section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .apt-section-header h2 {
        color: var(--text-main);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.25rem;
      }

      .cancel-all-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 1.25rem;
        background: transparent;
        border: 1.5px solid #ef4444;
        color: #ef4444;
        border-radius: 8px;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      .cancel-all-btn:hover {
        background: #ef4444;
        color: white;
        box-shadow: 0 3px 10px rgba(239, 68, 68, 0.25);
        transform: translateY(-1px);
      }

      .cancel-all-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
      }

      .apt-filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }

      .apt-filter-tab {
        padding: 0.5rem 1.25rem;
        border: 1.5px solid #e2e8f0;
        background: var(--bg-card);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
        color: #64748b;
        font-size: 0.875rem;
        font-family: inherit;
      }

      .apt-filter-tab:hover {
        border-color: #667eea;
        color: #667eea;
      }

      .apt-filter-tab.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: transparent;
      }

      .apt-filter-tab .tab-count {
        background: rgba(0, 0, 0, 0.08);
        padding: 1px 7px;
        border-radius: 10px;
        font-size: 0.75rem;
        margin-left: 0.35rem;
      }

      .apt-filter-tab.active .tab-count {
        background: rgba(255, 255, 255, 0.25);
      }

      .apt-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .apt-empty-state {
        text-align: center;
        padding: 3rem 2rem;
        color: #94a3b8;
      }

      .apt-empty-state i {
        font-size: 3rem;
        margin-bottom: 0.75rem;
        color: #cbd5e1;
        display: block;
      }

      .apt-empty-state h3 {
        color: #64748b;
        margin: 0 0 0.35rem 0;
        font-size: 1.1rem;
      }

      .apt-empty-state p {
        margin: 0;
        font-size: 0.9rem;
      }

      .apt-book-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        font-size: 0.9rem;
        transition: all 0.2s;
      }

      .apt-book-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      /* === Toast === */
      #aptToast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        min-width: 240px;
        max-width: 360px;
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        z-index: 9999;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
      }
      #aptToast.show {
        opacity: 1;
        transform: translateY(0);
      }
      #aptToast.success {
        background: #10b981;
      }
      #aptToast.error {
        background: #ef4444;
      }
      #aptToast.info {
        background: #667eea;
      }

      /* === Confirm Dialog === */
      #aptConfirmOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9990;
        align-items: center;
        justify-content: center;
      }
      #aptConfirmOverlay.show {
        display: flex;
      }
      #aptConfirmBox {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 2rem;
        max-width: 380px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      #aptConfirmBox p {
        color: #374151;
        margin: 0 0 1.5rem;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .confirm-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      .confirm-btn-yes {
        padding: 0.6rem 1.5rem;
        background: #ef4444;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .confirm-btn-yes:hover {
        background: #dc2626;
      }
      .confirm-btn-no {
        padding: 0.6rem 1.5rem;
        background: #e2e8f0;
        color: #374151;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .confirm-btn-no:hover {
        background: #cbd5e1;
      }

      @media (max-width: 768px) {
        .apt-page-container {
          padding: 1rem;
        }
        .apt-stats-row {
          grid-template-columns: repeat(2, 1fr);
        }
        .apt-content-section {
          padding: 1.25rem;
        }
        .apt-header h1 {
          font-size: 1.5rem;
        }
      }

      .cancelled-label {
        color: #e74c3c;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .apt-soon-label {
        color: #f39c12;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        animation: pulse 2s infinite;
      }
      .apt-completed-label {
        color: #7f8c8d;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="apt-page-container">
      <a href="index.html#appointments" class="apt-back-btn">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>

      <!-- Content -->
      <div class="apt-content-section">
        <div class="apt-section-header">
          <h2><i class="fas fa-list-alt"></i> All Appointments</h2>
          <button
            class="cancel-all-btn"
            id="cancelAllBtn"
            onclick="cancelAllAppointments()"
          >
            <i class="fas fa-times-circle"></i> Cancel All Confirmed
          </button>
        </div>

        <div class="apt-filter-tabs" id="filterTabs">
          <button class="apt-filter-tab active" data-filter="all">
            All <span class="tab-count" id="countAll">0</span>
          </button>
          <button class="apt-filter-tab" data-filter="confirmed">
            Confirmed <span class="tab-count" id="countConfirmed">0</span>
          </button>
          <button class="apt-filter-tab" data-filter="cancelled">
            Cancelled <span class="tab-count" id="countCancelled">0</span>
          </button>
        </div>

        <div class="apt-list" id="appointmentList">
          <div class="apt-empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading appointments...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast & Confirm Dialog -->
    <div id="aptToast"></div>
    <div id="aptConfirmOverlay">
      <div id="aptConfirmBox">
        <p id="aptConfirmMsg">Are you sure?</p>
        <div class="confirm-actions">
          <button class="confirm-btn-no" id="aptConfirmNo">Cancel</button>
          <button class="confirm-btn-yes" id="aptConfirmYes">
            Yes, Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- Config -->
    <script src="env-loader.js"></script>
    <script src="load-env.js"></script>
    <script>
      const CONFIG = {
        API_BASE_URL:
          (window.ENV && window.ENV.API_BASE_URL) ||
          "http://localhost:5000/api",
      };

      let appointments = [];
      let activeFilter = "all";

      // === Toast ===
      let _toastTimer;
      function showToast(msg, type = "info") {
        const t = document.getElementById("aptToast");
        t.textContent = msg;
        t.className = `show ${type}`;
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => (t.className = ""), 3500);
      }

      // === Custom Confirm ===
      let _confirmResolve = null;
      function aptConfirm(msg) {
        return new Promise((resolve) => {
          _confirmResolve = resolve;
          document.getElementById("aptConfirmMsg").textContent = msg;
          document.getElementById("aptConfirmOverlay").classList.add("show");
        });
      }

      function handleConfirm(val) {
        document.getElementById("aptConfirmOverlay").classList.remove("show");
        if (_confirmResolve) {
          _confirmResolve(val);
          _confirmResolve = null;
        }
      }

      // Initialize confirm listeners once
      document.getElementById("aptConfirmYes").addEventListener("click", () => handleConfirm(true));
      document.getElementById("aptConfirmNo").addEventListener("click", () => handleConfirm(false));
      document.getElementById("aptConfirmOverlay").addEventListener("click", (e) => {
        if (e.target.id === "aptConfirmOverlay") handleConfirm(false);
      });

      // ---- Formatting (Correct Fix) ----
      function formatAppointmentTime(dateString) {
        if (!dateString) return "No date set";
        const now = new Date();
        const date = new Date(dateString);

        if (isNaN(date.getTime())) return dateString;

        const diff = date - now;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        // Highlight "Starting soon" if within 1 hour
        if (minutes > 0 && minutes < 60) {
          return `<span class="apt-soon-label"><i class="fas fa-clock"></i> Starting in ${minutes} min</span>`;
        }

        if (hours > 0 && hours < 24) {
          return `In ${hours} hours at ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        }

        if (days === 0) {
          return `Today at ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        }

        if (days === 1) {
          return `Tomorrow at ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        }

        if (days > 1 && days < 7) {
          return `In ${days} days at ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        }

        if (diff < 0) {
          return `<span class="apt-completed-label"><i class="fas fa-check-circle"></i> Completed</span>`;
        }

        return date.toLocaleDateString() + " at " +
               date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }

      function updateAppointmentTimes() {
        document.querySelectorAll(".appointment-date").forEach(el => {
          const time = el.dataset.time;
          if (time) {
            el.innerHTML = `<i class="fas fa-calendar-alt"></i> ${formatAppointmentTime(time)}`;
          }
        });
      }

      // Initialize on load and refresh every minute
      document.addEventListener("DOMContentLoaded", updateAppointmentTimes);
      setInterval(updateAppointmentTimes, 60000);

      // ---- Load Data ----
      async function loadAppointments() {
        // Priority 1: Try fetching from server for the latest truth
        const userId = localStorage.getItem("medicsense_user_id") || "guest_user";

        try {
          const res = await fetch(`${CONFIG.API_BASE_URL}/appointments?user_id=${userId}`);
          const data = await res.json();
          if (data.success && data.data) {
            appointments = data.data;
            localStorage.setItem("medicsense_appointments", JSON.stringify(appointments));
            console.log("Synced appointments from server:", appointments.length);
          }
        } catch (err) {
          console.error("Failed to sync from server, falling back to local storage:", err);
          const raw = localStorage.getItem("medicsense_appointments");
          if (raw) appointments = JSON.parse(raw) || [];
        }

        updateStats();
        renderAppointments();
      }

      // ---- Stats ----
      function updateStats() {
        const confirmed = appointments.filter(
          (a) => a.status === "confirmed"
        ).length;
        const cancelled = appointments.filter(
          (a) => a.status === "cancelled"
        ).length;
        document.getElementById("countAll").textContent = appointments.length;
        document.getElementById("countConfirmed").textContent = confirmed;
        document.getElementById("countCancelled").textContent = cancelled;
      }

      // ---- Filter ----
      function getFilteredAppointments() {
        switch (activeFilter) {
          case "confirmed":
            return appointments.filter((a) => a.status === "confirmed");
          case "cancelled":
            return appointments.filter((a) => a.status === "cancelled");
          default:
            return [...appointments];
        }
      }

      // ---- Render ----
      function renderAppointments() {
        // PRODUCTION FIX: Only display confirmed appointments by default in the main view
        // The user specifically requested:
        // const upcoming = appointments.filter(a => a.status === "confirmed");
        // renderAppointments(upcoming);
        // I am wrapping this inside the activeFilter logic to respect tab switching

        const listEl = document.getElementById("appointmentList");
        if (!listEl) return;
        listEl.innerHTML = "";

        let baseList = appointments;
        if (activeFilter === "upcoming") {
             // For the default "Upcoming" tab, strictly show only confirmed
             baseList = appointments.filter(a => a.status === "confirmed");
        } else {
             baseList = getFilteredAppointments();
        }

        const filtered = baseList.sort(
          (a, b) =>
            new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date)
        );

        if (filtered.length === 0) {
          listEl.innerHTML = `
            <div class="apt-empty-state">
              <i class="fas fa-calendar-times"></i>
              <h3>No appointments found</h3>
              <p>No appointments match the selected filter.</p>
              <a href="index.html#appointments" class="apt-book-cta">
                <i class="fas fa-calendar-plus"></i> Book an Appointment
              </a>
            </div>`;
          return;
        }

        listEl.innerHTML = filtered
          .map(
            (apt) => {
              const fullTime = apt.datetime || (apt.date + 'T' + apt.time + ':00');
              const isPast = new Date(fullTime) < new Date();

              return `
                <div class="appointment-card" id="appointment-${apt.id}" data-id="${apt.id}">
                  <div class="appointment-info">
                    <h4>👨‍⚕️ ${apt.doctor_name || apt.doctor || "Doctor"}</h4>
                    <div class="appointment-date" data-time="${fullTime}">
                      <!-- Content populated by updateAppointmentTimes -->
                    </div>
                    ${
                      apt.reason
                        ? `<p class="appointment-reason"><i class="fas fa-notes-medical"></i> ${apt.reason}</p>`
                        : ""
                    }
                    <span class="status-badge ${apt.status}">${
                    apt.status.charAt(0).toUpperCase() + apt.status.slice(1)
                  }</span>
                  </div>
                  <div class="appointment-actions">
                    ${
                      apt.status !== "cancelled" && !isPast
                        ? `<button class="cancel-btn" data-apt-id="${apt.id}">Cancel</button>`
                        : apt.status === "cancelled"
                          ? `<span class="cancelled-label"><i class="fas fa-ban"></i> Cancelled</span>`
                          : ""
                    }
                  </div>
                </div>`;
            }
          )
          .join("");

        // Immediately update formatting after injection
        updateAppointmentTimes();

        listEl.querySelectorAll(".cancel-btn").forEach((btn) => {
          btn.addEventListener("click", () =>
            cancelAppointment(btn.dataset.aptId, btn)
          );
        });
      }

      // ---- Cancel ----
      async function cancelAppointment(id, btn) {
        console.log("Cancel appointment ID:", id); // Step 2 — Check the ID Passed

        // Pro Hackathon Tip: Make cancel feel premium
        btn.innerText = "Cancelling...";
        btn.disabled = true;

        try {
          // Send userId to satisfy the backend validation and trigger notifications correctly
          const userId = localStorage.getItem("medicsense_user_id") || "guest_user";
          const res = await fetch(`/api/appointments/${id}/cancel`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: userId })
          });

          const data = await res.json();

          if (data.success || res.ok) {
            // Success State
            btn.innerHTML = "✔ Appointment Cancelled";
            showToast("Appointment Cancelled", "success");

            const card = document.querySelector(`#appointment-${id}`);
            if (card) {
                // remove card instantly
                card.remove();
            }

            // 🔥 refresh dashboard
            await loadAppointments();
            if (typeof updateAppointmentsList === 'function') {
                await updateAppointmentsList();
            }
          } else {
            showToast(data.message || "Failed to cancel", "error");
            btn.innerText = "Cancel";
            btn.disabled = false;
          }
        } catch (error) {
          console.error("Error cancelling:", error);
          showToast("Network error", "error");
          btn.innerText = "Cancel";
          btn.disabled = false;
        }
      }

      // ---- Cancel All ----
      async function cancelAllAppointments() {
        const confirmed = appointments.filter((a) => a.status === "confirmed");
        if (confirmed.length === 0) {
          showToast("No confirmed appointments to cancel.", "info");
          return;
        }

        const ok = await aptConfirm(
          `Cancel all ${confirmed.length} confirmed appointment(s)? This cannot be undone.`
        );
        if (!ok) return;

        const btn = document.getElementById("cancelAllBtn");
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cancelling...';
        btn.disabled = true;

        const userId =
          localStorage.getItem("medicsense_user_id") || "guest_user";
        let successCount = 0;

        for (const apt of confirmed) {
          try {
            const response = await fetch(
              `${CONFIG.API_BASE_URL}/appointments/${apt.id}/cancel?user_id=${userId}`,
              { method: "POST" }
            );
            const data = await response.json();
            if (data.success || response.ok) {
              apt.status = "cancelled";
              successCount++;
            }
          } catch (e) {
            console.error(`Failed to cancel ${apt.id}:`, e);
          }
        }

        localStorage.setItem(
          "medicsense_appointments",
          JSON.stringify(appointments)
        );
        updateStats();
        renderAppointments();
        btn.innerHTML =
          '<i class="fas fa-times-circle"></i> Cancel All Confirmed';
        btn.disabled = false;
        showToast(
          `Cancelled ${successCount} of ${confirmed.length} appointment(s)`,
          successCount === confirmed.length ? "success" : "info"
        );
      }

      // ---- Tab Switching ----
      document.getElementById("filterTabs").addEventListener("click", (e) => {
        const tab = e.target.closest(".apt-filter-tab");
        if (!tab) return;
        document
          .querySelectorAll(".apt-filter-tab")
          .forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderAppointments();
      });

      // ---- Init ----
      try {
        loadAppointments();
      } catch (error) {
        console.error("Error in loadAppointments:", error);
        const listEl = document.getElementById("appointmentList");
        if (listEl) {
          listEl.innerHTML = `
            <div class="apt-empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <h3>Error loading appointments</h3>
              <p>Please refresh the page or try again later.</p>
            </div>`;
        }
      }
    </script>
  </body>
</html>
