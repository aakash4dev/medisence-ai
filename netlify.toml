# Netlify configuration for MedicSense AI frontend

[build]
  # No build step needed — pure static HTML/CSS/JS
  publish = "frontend"

# Redirect all routes to index.html for SPA-style navigation
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(self)"
    Content-Security-Policy   = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';"
